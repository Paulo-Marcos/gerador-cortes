version: 2

# D-689: correções e versões menores chegam num PR só por ecossistema; versão
# maior continua vindo uma a uma, porque cada uma pede avaliação própria. Antes
# eram PRs soltos: 20 ficaram abertos desde julho, bateram no limite de PRs por
# ecossistema e o Dependabot parou de propor atualização nova — inclusive as de
# segurança.
#
# commit-message: o hook e o lock-check conferem o padrão do AGENTS.md (D-684).
# Sem o prefixo, o Dependabot escreve `build(deps): ...` e todo PR dele nasce
# reprovado.

updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-backend:
        update-types: ["minor", "patch"]
    ignore:
      # O 5.0 removeu os Haar cascades que o detector de rosto usa (D-583,
      # comentário no requirements.txt). Subir é demanda, não atualização.
      - dependency-name: "opencv-python"
        versions: [">=5"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-frontend:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/video-renderer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-renderer:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "👷 ci"
      include: "scope"
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
