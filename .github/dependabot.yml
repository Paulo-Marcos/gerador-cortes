version: 2

# D-689: correções e versões menores chegam num PR só por ecossistema; versão
# maior continua vindo uma a uma, porque cada uma pede avaliação própria. Antes
# eram PRs soltos: 20 ficaram abertos desde julho, bateram no limite de PRs por
# ecossistema e o Dependabot parou de propor atualização nova — inclusive as de
# segurança.
#
# commit-message: o hook e o lock-check conferem o padrão do AGENTS.md (D-684).
# Sem o prefixo, o Dependabot escreve `build(deps): ...` e todo PR dele nasce
# reprovado.

updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-backend:
        update-types: ["minor", "patch"]
    # D-796: requirements.in é a intenção e requirements.txt o lock gerado pelo
    # `uv pip compile` (comando no cabeçalho do lock). O PR do Dependabot é o
    # sinal; o lote se refaz localmente regenerando o lock (skill pr-bump), e o
    # teste do ambiente confere que o que roda é o que está no lock.
    ignore:
      # O 5.0 removeu os Haar cascades que o detector de rosto usa (D-583,
      # comentário no requirements.in). Subir é demanda, não atualização.
      - dependency-name: "opencv-python"
        versions: [">=5"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-frontend:
        update-types: ["minor", "patch"]
    ignore:
      # Os tipos acompanham o Node que roda o app (24, D-781), não o mais novo.
      # Sobe junto com o Node, como demanda.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # O 0.5 exige ESLint 9; a migração do ESLint é demanda (D-825), e este
      # ignore sai nela.
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5"]

  - package-ecosystem: "npm"
    directory: "/video-renderer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
    groups:
      correcoes-renderer:
        update-types: ["minor", "patch"]
    ignore:
      # O Remotion fixa o zod numa versão exata, e os schemas daqui entram no
      # <Composition schema>: duas cópias do zod quebram a validação e o editor
      # de props do Studio. O zod sobe junto com o Remotion (D-824).
      - dependency-name: "zod"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "👷 ci"
      include: "scope"
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
