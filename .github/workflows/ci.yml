name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # D-687 supera a D-212 (versão fixa): o gatilho dela disparou — a v0.3.0 é
    # para outros instalarem. 3.11 é o mínimo que o SETUP promete; 3.13 é o que a
    # produção roda. Já houve diferença real entre os dois (str(enum), D-665).
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # D-662: fronteiras das camadas (contratos em pyproject.toml). A dívida
      # atual está listada lá; um import novo na direção errada para aqui.
      - name: Contratos de camada (import-linter)
        run: lint-imports --no-cache

      - name: pip-audit (bloqueia em CVE critico; high/moderate ficam informativos)
        run: |
          pip install pip-audit
          python ../bin/pip_audit_gate.py requirements.txt

      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (lint + tsc + vitest + build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # D-687: 20 é o mínimo que o SETUP promete; 24 é o que a produção roda.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O tsconfig do frontend aponta @video-renderer/* para ../video-renderer/src,
      # entao o typecheck/build resolve imports (remotion, react) pelo node_modules
      # do video-renderer — sem ele instalado, o tsc falha com TS2307.
      - name: Install video-renderer dependencies
        working-directory: video-renderer
        run: npm ci

      - name: npm audit (bloqueia em CVE critico)
        run: npm audit --audit-level=critical

      - name: npm audit (informativo, high/moderate)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  video-renderer:
    name: Video Renderer (lint + test:cards + build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # D-687: mesma matriz do frontend. O Node 24 já teve bug próprio aqui
    # (extract-zip do navegador do Remotion, D-671).
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    defaults:
      run:
        working-directory: video-renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (bloqueia em CVE critico)
        run: npm audit --audit-level=critical

      - name: npm audit (informativo, high/moderate)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Contract tests (remotion still)
        run: npm run test:cards

      - name: Build (remotion bundle)
        run: npm run build

  windows:
    # D-688: o app só é suportado no Windows (ADR-0008), e o resto do CI roda em
    # Linux. Este job exercita o que só o Windows tem: o bootstrap.ps1, o primeiro
    # boot num checkout limpo e o pytest sobre caminhos, encoding e subprocessos
    # do Windows. Versões da produção (3.13 / Node 24).
    name: Windows (bootstrap + boot limpo + pytest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # O runner não traz ffmpeg; o app e parte dos testes precisam dele.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Bootstrap (o mesmo script que o usuário roda)
        run: powershell -ExecutionPolicy Bypass -File bin\bootstrap.ps1 -Dev

      - name: Boot limpo (health, canal criado, escuta só em 127.0.0.1)
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path instance) { throw "o checkout nao esta limpo: instance\ ja existe" }

          $args_ = @("-m", "uvicorn", "--app-dir", "backend", "--host", "127.0.0.1", "--port", "8000", "app.main:app")
          $backend = Start-Process -FilePath backend\.venv\Scripts\python.exe -ArgumentList $args_ -PassThru -NoNewWindow `
              -RedirectStandardOutput boot.out.log -RedirectStandardError boot.err.log
          try {
              $ok = $false
              for ($i = 0; $i -lt 90; $i++) {
                  try {
                      $r = Invoke-WebRequest "http://localhost:8000/api/health" -UseBasicParsing -TimeoutSec 5
                      if ($r.StatusCode -eq 200) { $ok = $true; break }
                  } catch { Start-Sleep -Seconds 2 }
              }
              if (-not $ok) { throw "o backend nao respondeu /api/health em 3 minutos" }
              Write-Host "ok: /api/health respondeu 200"

              $canais = @(Get-ChildItem instance\channels -Directory -ErrorAction SilentlyContinue)
              if ($canais.Count -lt 1) { throw "o primeiro boot nao criou nenhum canal em instance\channels" }
              if (-not (Test-Path instance\settings.db)) { throw "o primeiro boot nao criou instance\settings.db" }
              Write-Host "ok: primeiro boot criou o canal '$($canais[0].Name)' e o settings.db"

              $escuta = @(Get-NetTCPConnection -LocalPort 8000 -State Listen | Select-Object -ExpandProperty LocalAddress -Unique)
              if ($escuta.Count -ne 1 -or $escuta[0] -ne "127.0.0.1") { throw "o backend escuta em '$($escuta -join ', ')', esperado so 127.0.0.1" }
              Write-Host "ok: escuta so em 127.0.0.1"
          }
          catch {
              Write-Host "---- boot.err.log ----"; Get-Content boot.err.log -ErrorAction SilentlyContinue | Select-Object -Last 60
              throw
          }
          finally {
              # Só pelo PID que este passo iniciou; o uvicorn sem --reload não tem filhos.
              Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Run pytest
        working-directory: backend
        run: .venv\Scripts\python.exe -m pytest
