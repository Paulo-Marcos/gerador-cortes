name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # D-687 supera a D-212 (versão fixa): o gatilho dela disparou — a v0.3.0 é
    # para outros instalarem. 3.11 é o mínimo que o SETUP promete; 3.13 é o que a
    # produção roda. Já houve diferença real entre os dois (str(enum), D-665).
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # D-662: fronteiras das camadas (contratos em pyproject.toml). A dívida
      # atual está listada lá; um import novo na direção errada para aqui.
      - name: Contratos de camada (import-linter)
        run: lint-imports --no-cache

      - name: pip-audit (bloqueia em CVE critico; high/moderate ficam informativos)
        run: |
          pip install pip-audit
          python ../bin/pip_audit_gate.py requirements.txt

      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (lint + tsc + vitest + build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # D-687: 20 é o mínimo que o SETUP promete; 24 é o que a produção roda.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O tsconfig do frontend aponta @video-renderer/* para ../video-renderer/src,
      # entao o typecheck/build resolve imports (remotion, react) pelo node_modules
      # do video-renderer — sem ele instalado, o tsc falha com TS2307.
      - name: Install video-renderer dependencies
        working-directory: video-renderer
        run: npm ci

      - name: npm audit (bloqueia em CVE critico)
        run: npm audit --audit-level=critical

      - name: npm audit (informativo, high/moderate)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  video-renderer:
    name: Video Renderer (lint + test:cards + build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # D-687: mesma matriz do frontend. O Node 24 já teve bug próprio aqui
    # (extract-zip do navegador do Remotion, D-671).
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    defaults:
      run:
        working-directory: video-renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (bloqueia em CVE critico)
        run: npm audit --audit-level=critical

      - name: npm audit (informativo, high/moderate)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Contract tests (remotion still)
        run: npm run test:cards

      - name: Build (remotion bundle)
        run: npm run build
