# Hooks de qualidade (D-089). Rodam apenas nos arquivos staged/alterados,
# entao NAO disparam reformat retroativo no codigo intocado.
#
# Instalar uma vez por clone:
#   pip install pre-commit
#   pre-commit install
#
# Rodar manualmente em tudo (reformat amplo — tarefa separada):
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint "$@"' --
        language: system
        files: ^frontend/.*\.(ts|tsx)$
