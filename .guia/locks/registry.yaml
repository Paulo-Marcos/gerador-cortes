# Veja features/README.md para o protocolo e formato.
# Edicao via CLI (recomendado): python bin/check-lock.py lock|unlock
# Ou edite manualmente preservando o schema abaixo.

version: 1
locks:
# D-925: so os testes ficam travados. Eles sao o contrato do comportamento:
# mudar ou apagar um teste exige autorizacao do dono; criar teste novo e livre.
# Os padroes usam fnmatch, em que `*` atravessa pastas.
- id: testes-sao-contrato
  description: Testes garantem o comportamento; alterar/apagar exige autorizacao
  operations: [modify, delete, rename]
  files:
  - 'backend/tests/*'
  - '*/__tests__/*'
  - '*.test.ts'
  - '*.test.tsx'
