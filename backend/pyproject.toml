[tool.ruff]
target-version = "py311"  # D-687: o mínimo suportado, para o ruff não sugerir sintaxe que o 3.11 não roda
line-length = 100
src = ["app", "tests"]
extend-exclude = ["projetos", "assets"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B)
# T20 (flake8-print): D-655. `print` num módulo servidor escreve direto no cano
# do terminal — e um cano que ninguém lê CONGELA o backend (foi o que aconteceu
# aqui: o app só destravava ao focar a janela). Log passa pela infraestrutura
# de logging, que trata isso. Os scripts de terminal ficam de fora, abaixo.
# PLR2004 (número mágico em comparação): D-717. Limiar com nome diz o que mede e
# por que tem aquele valor; nos testes o número no assert É o esperado, e fica.
select = ["E", "F", "W", "I", "UP", "B", "T20", "PLR2004"]
ignore = [
  # Comprimento de linha fica a cargo do formatter (ruff format).
  "E501",
  # StatusProjeto/StatusCorte/StatusShort etc. herdam de (str, Enum) de proposito:
  # trocar por StrEnum muda o str() dos membros e quebraria serializacao/contrato de DB.
  "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# Padrao FastAPI: `def rota(x = Depends(...))` / `Query(...)` etc. nao e mutable-default (B008).
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Testes ajustam sys.path antes de importar (E402) e usam pytest.raises(Exception) (B017).
"tests/**" = ["B017", "E402", "T20", "PLR2004"]
# Scripts de linha de comando: imprimir É a interface deles (D-655).
"dev-utils/**" = ["T20", "PLR2004"]
"app/services/canal/channel_layout_migration.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# D-662: as fronteiras das camadas, verificadas por máquina.
#
# A regra "domain puro, setas para dentro" vivia só no AGENTS.md — e as
# violações entraram sem alarme. Aqui ela vira catraca: a dívida que já existe
# entra em `ignore_imports`, com nome e a demanda que vai quitá-la; qualquer
# import NOVO na direção errada quebra o `lint-imports` (CI e pytest).
#
# Apertar é apagar uma linha de `ignore_imports` quando a demanda dela fechar.
# Afrouxar (acrescentar uma) é decisão de arquitetura, não atalho de PR.
#
# Windows: com a saída descartada (`> NUL`, `> /dev/null`) o relatório do `rich`
# cai no caminho de console em cp1252 e o comando sai com 1 mesmo com os
# contratos KEPT. Rode com `PYTHONUTF8=1` ou grave a saída em arquivo.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "dominio-puro"
name = "domain nao conhece framework, banco, HTTP nem as outras camadas"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "httpx",
    "requests",
    "app.routers",
    "app.services",
    "app.infrastructure",
    "app.models",
    "app.database",
    # Logging e estado de processo são efeito colateral (ADR-0015 §2).
    "app.core",
]

[[tool.importlinter.contracts]]
id = "camadas"
name = "routers -> services -> infrastructure -> domain"
type = "layers"
layers = [
    "app.routers",
    "app.services",
    "app.infrastructure",
    "app.domain",
]

[[tool.importlinter.contracts]]
id = "routers-sem-infra"
name = "routers nao falam direto com infrastructure"
type = "forbidden"
source_modules = ["app.routers"]
forbidden_modules = ["app.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "models-sem-services"
name = "models nao importa services nem routers"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.services", "app.routers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "core-na-base"
name = "core so importa domain e bibliotecas (ADR-0015)"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.routers",
    "app.services",
    "app.infrastructure",
    "app.models",
    "app.database",
]

[[tool.importlinter.contracts]]
id = "clientes-externos-na-infraestrutura"
name = "so a infraestrutura fala com clientes externos (D-696)"
type = "forbidden"
source_modules = ["app.routers", "app.services", "app.domain"]
forbidden_modules = ["httpx", "sqlite3", "google", "googleapiclient", "google_auth_oauthlib"]
# Direto só: chamar a infraestrutura, que fala com o cliente, é o caminho certo.
allow_indirect_imports = true
ignore_imports = [
    # D-756: o envio de vídeo do corte ainda fala com o Google direto (youtube.py, travado).
    "app.services.youtube -> google",
    "app.services.youtube -> googleapiclient",
]

[[tool.importlinter.contracts]]
id = "agregados-independentes"
name = "um agregado do dominio nao importa outro (ADR-0015 §2)"
type = "layers"
# Cada pasta de agregado entra aqui no mesmo commit em que nasce (D-759).
layers = [
    "app.domain.projeto | app.domain.corte | app.domain.short | app.domain.publicacao | app.domain.canal | app.domain.live_candidata",
    "app.domain.compartilhado",
]
