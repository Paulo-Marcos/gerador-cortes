[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: teste pesado (D-751) - processo externo real (ffmpeg, Node, OpenCV), varredura do repositorio
        ou codificacao de imagem. Fica fora do ciclo rapido (pytest -m "not integration"); roda no suite
        completo e no CI.
